    <h1><mark>MANIPULANDO IMAGENS </mark> DO HTML ATRAVÉS DO JS</h1>
<div>
        <img src="img/CORINTHIANS.jpg" alt="time" width="250px" title="time">
        <button onclick="trocar_img()">Trocar Imagem</button>
        <li><a href="index.html" target="_blank">Sair</a></li>
    </div>

    <script>

        function trocar_img() {
            const tags_src = document.getElementsByTagName('img')


            console.log(tags_src);
            let tags_src_1 = tags_src[0]
            if (tags_src_1.title == "CORINTHIANS") {
                tags_src_1.src = "img/torcida.jpg"
                tags_src_1.title = "torcida"

            } else {
                tags_src_1.src = "img/CORINTHIANS.jpg";
                tags_src_1.title = "CORINTHIANS"
            }


        }
    </script>
